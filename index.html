// Calcula qué ajustes saldrían de lo apuntado (solo categorías con gastos ese mes).
function calcAjustesDesdeGastos(y, m, lista) {
  const mData = getMonthsForYear(y)[m];
  const t = sumaPorCat(lista);
  const porAjuste = { ocio: 0, gasolina: 0, compra: 0 };
  const hay = { ocio: false, gasolina: false, compra: false };
  getCats().forEach(c => { if (c.ajuste && t[c.id] > 0) { porAjuste[c.ajuste] += t[c.id]; hay[c.ajuste] = true; } });
  const r = calcMonth(mData);
  const res = [];
  if (hay.gasolina) res.push({ campo: "ajusteGasolina", nombre: "Gasolina", gastado: porAjuste.gasolina, presup: pv("gasolina", mData) });
  if (hay.compra) res.push({ campo: "ajusteCompra", nombre: "Compra", gastado: porAjuste.compra, presup: pv("compra", mData) });
  if (hay.ocio && r) res.push({ campo: "ajusteOcio", nombre: "Ocio y comida fuera", gastado: porAjuste.ocio, presup: r.ocioPresupuestado });
  res.forEach(x => { x.ajuste = round2(x.gastado - x.presup); });
  const sinSalario = hay.ocio && !r;
  const sinAsignar = getCats().filter(c => !c.ajuste && t[c.id] > 0).map(c => `${c.e} ${c.n} ${euro(t[c.id])}`);
  return { mData, res, sinSalario, sinAsignar };
}

function renderAplicarAjustes(y, m, lista) {
  if (!lista.length) return "";
  const { mData, res, sinSalario, sinAsignar } = calcAjustesDesdeGastos(y, m, lista);
  if (!res.length && !sinSalario) return "";
  return `
    <div class="section-title">Pasar a Mi Presupuesto</div>
    <div class="card">
      <p style="font-size:12.5px; color:var(--gray); margin:0 0 10px;">Compara lo que has apuntado con el presupuesto de ${MONTHS[m]} y calcula los ajustes por ti. Solo toca las categorías en las que has apuntado algo. Hazlo al final del mes, cuando ya tengas apuntado todo.</p>
      ${res.map(x => `<div class="result-row"><span class="label">${x.nombre}<span style="display:block; font-size:11px; color:var(--light-gray); font-weight:400; margin-top:2px;">Gastado ${euro(x.gastado)} · presupuesto ${euro(x.presup)}</span></span><span class="value" style="color:${x.ajuste > 0 ? "var(--red)" : "var(--teal)"}">${x.ajuste > 0 ? "+" : ""}${euro(x.ajuste)}</span></div>`).join("")}
      ${sinSalario ? `<p style="font-size:12px; color:var(--red); margin:8px 0 0;">Para calcular el ajuste de ocio, primero pon el salario de ${MONTHS[m]} en la pestaña Mensual.</p>` : ""}
      ${sinAsignar.length ? `<p style="font-size:11.5px; color:var(--light-gray); margin:8px 0 0;">No cuentan en ningún ajuste: ${sinAsignar.join(" · ")}. Si quieres que resten, añádelos como gasto excepcional en Mensual.</p>` : ""}
      ${mData.cerrado ? `<p style="font-size:12px; color:var(--gray); margin:8px 0 0;">🔒 ${MONTHS[m]} está cerrado: reábrelo en Mensual para poder aplicar los ajustes.</p>` : ""}
      ${res.length ? `<button class="btn" id="g-aplicar" type="button" ${mData.cerrado ? "disabled" : ""}>Aplicar a los ajustes de ${MONTHS[m]}</button>` : ""}
    </div>`;
}


// ---------- Importar gastos desde Excel (formato de apps tipo "Money Manager") ----------
const IMPORT_EXCLUIR = ["transferencia", "actualizacion saldo", "saldo", "saldo inicial"];
const IMPORT_AJUSTE = {
  gasolina: "gasolina", compra: "compra",
  comida: "ocio", "comida curro": "ocio", torti: "ocio", bebidas: "ocio", "100 montaditos": "ocio", salida: "ocio",
  cine: "ocio", ocio: "ocio", apuestas: "ocio", loteria: "ocio", fiesta: "ocio", carnaval: "ocio",
  videojuego: "ocio", psn: "ocio", libros: "ocio",
};
const IMPORT_EMOJI = {
  comida: "🍔", "comida curro": "🥪", torti: "🌮", bebidas: "🍺", "100 montaditos": "🥖", salida: "🍻", cine: "🎬", ocio: "🎮",
  apuestas: "🎲", loteria: "🎟️", fiesta: "🎉", carnaval: "🎭", videojuego: "🕹️", psn: "🎮", libros: "📚",
  gasolina: "⛽", compra: "🛒", viajes: "✈️", complementos: "🎒", garage: "🔧", coche: "🚗", "hard rock": "🎸", paris: "🗼",
  boombastic: "🎶", regalo: "🎁", suscripcion: "🔁", madrid: "🏙️", lanzarote: "🌋", ropa: "👕", mama: "💐", decathlon: "🏃",
  flores: "🌸", dentista: "🦷", peluqueria: "💈", seguro: "🛡️", parking: "🅿️", bizum: "📲", transporte: "🚌", otros: "📦",
};
const quitaTildes = t => String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().trim();
function slugCat(n) { return quitaTildes(n).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "cat"; }

function serialAISO(v) {
  if (typeof v === "number") return new Date(Math.floor(v - 25569) * 86400000).toISOString().slice(0, 10);
  const m = String(v || "").match(/(\d{4})-(\d{2})-(\d{2})/);
  if (m) return m[0];
  const d = String(v || "").match(/(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})/);
  return d ? `${d[3]}-${p2(d[2])}-${p2(d[1])}` : null;
}

function leerExcelGastos(wb) {
  const ws = wb.Sheets[wb.SheetNames[0]];
  const filas = XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null });
  if (!filas.length) return { error: "El archivo está vacío." };
  const cab = filas[0].map(quitaTildes);
  const col = (...nombres) => cab.findIndex(h => nombres.some(n => h.includes(n)));
  const cFecha = 0 + (col("periodo", "fecha") >= 0 ? col("periodo", "fecha") : 0);
  const cCat = col("categoria"), cNota = col("nota"), cDesc = col("descripcion");
  const cImp = col("eur") >= 0 ? col("eur") : col("importe"), cTipo = col("ingreso/gasto", "tipo");
  if (cCat < 0 || cImp < 0 || cTipo < 0) return { error: "No reconozco las columnas. Necesito: fecha, categoría, importe e Ingreso/Gasto." };
  const out = [], excl = { ingresos: 0, noGasto: 0, otros: 0 };
  filas.slice(1).forEach((f, i) => {
    const tipo = quitaTildes(f[cTipo]);
    if (!tipo) return;
    if (!tipo.startsWith("gasto")) { excl.ingresos++; return; }
    const cat = String(f[cCat] || "Otros").trim();
    if (IMPORT_EXCLUIR.includes(quitaTildes(cat))) { excl.noGasto++; return; }
    const fecha = serialAISO(f[cFecha]), importe = Number(f[cImp]);
    if (!fecha || !importe || importe <= 0) { excl.otros++; return; }
    const concepto = String((cNota >= 0 && f[cNota]) || (cDesc >= 0 && f[cDesc]) || cat).trim();
    const ms = typeof f[cFecha] === "number" ? Math.round((f[cFecha] - 25569) * 86400000) : Date.parse(fecha);
    out.push({ id: ms + i, fecha, concepto, importe: round2(importe), catNombre: cat });
  });
  return { gastos: out, excl };
}

async function importarGastosArchivo(file) {
  const msg = document.getElementById("g-import-msg");
  const aviso = (t, color) => { msg.style.display = "block"; msg.style.color = color || "var(--gray)"; msg.textContent = t; };
  try {
    if (typeof XLSX === "undefined" || !XLSX.read) { aviso("No se ha cargado el lector de Excel. Comprueba tu conexión.", "var(--red)"); return; }
    const wb = XLSX.read(await file.arrayBuffer(), { type: "array" });
    const r = leerExcelGastos(wb);
    if (r.error) { aviso(r.error, "var(--red)"); return; }
    if (!r.gastos.length) { aviso("No he encontrado gastos para importar.", "var(--red)"); return; }

    // Categorías: reutiliza las existentes por nombre y crea las que falten.
    let cats = getCats().map(c => ({ ...c }));
    const nuevasCats = [];
    const idDe = {};
    r.gastos.forEach(g => {
      const k = quitaTildes(g.catNombre);
      if (idDe[k]) return;
      let c = cats.find(x => quitaTildes(x.n) === k);
      if (!c) {
        let id = slugCat(g.catNombre); while (cats.some(x => x.id === id)) id += "-2";
        c = { id, n: g.catNombre, e: IMPORT_EMOJI[k] || "🏷️" };
        if (IMPORT_AJUSTE[k]) c.ajuste = IMPORT_AJUSTE[k];
        cats.push(c); nuevasCats.push(c);
      }
      idDe[k] = c.id;
    });

    // Sin duplicados
    const clave = g => [g.fecha, g.importe, g.concepto.toLowerCase(), g.cat].join("|");
    // Cuenta cuántos iguales hay ya guardados: así se respetan las compras idénticas repetidas el mismo día.
    const existentes = {};
    Object.values(gastosByYear).flat().forEach(g => { const k = clave(g); existentes[k] = (existentes[k] || 0) + 1; });
    const nuevos = [];
    r.gastos.forEach(g => {
      const x = { id: g.id, fecha: g.fecha, concepto: g.concepto, importe: g.importe, cat: idDe[quitaTildes(g.catNombre)] };
      const k = clave(x);
      if (existentes[k] > 0) existentes[k]--; else nuevos.push(x);
    });
    const dup = r.gastos.length - nuevos.length;
    if (!nuevos.length) { aviso(`Todo lo del archivo ya estaba importado (${dup} gastos repetidos).`); return; }
    const total = nuevos.reduce((a, g) => a + g.importe, 0);
    const txt = `Voy a importar ${nuevos.length} gastos (${euro(total)})` + (nuevasCats.length ? ` y crear ${nuevasCats.length} categorías nuevas` : "") +
      (dup ? `. ${dup} ya estaban y se saltan` : "") + `. Se dejan fuera ${r.excl.ingresos} ingresos y ${r.excl.noGasto} movimientos de transferencia/saldo. ¿Continuar?`;
    if (!confirm(txt)) { aviso("Importación cancelada."); return; }

    const tocados = new Set();
    nuevos.forEach(g => { const a = g.fecha.slice(0, 4); (gastosByYear[a] = gastosByYear[a] || []).push(g); tocados.add(a); });
    if (nuevasCats.length) { params.categorias = cats; }
    const hoyV = new Date(); gastosView = { y: hoyV.getFullYear(), m: hoyV.getMonth() };
    render();
    if (nuevasCats.length) await saveParams();
    for (const a of tocados) await saveGastosYear(a);
    const m2 = document.getElementById("g-import-msg");
    if (m2) { m2.style.display = "block"; m2.style.color = "var(--teal)"; m2.textContent = `✅ Importados ${nuevos.length} gastos.`; }
  } catch (e) {
    console.error(e); aviso("No se ha podido leer el archivo: " + (e.message || e), "var(--red)");
  }
}

function attachGastosHandlers() {
  const go = d => {
    let { y, m } = gastosView; m += d;
    if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
    gastosView = { y, m }; gastoEditId = null; render();
  };
  document.getElementById("g-prev").onclick = () => go(-1);
  document.getElementById("g-next").onclick = () => go(1);

  const concepto = document.getElementById("g-concepto");
  concepto.onchange = () => {
    // Si ya apuntaste antes ese concepto, propone la misma categoría.
    if (gastoEditId) return;
    const prev = Object.values(gastosByYear).flat().filter(g => g.concepto.toLowerCase() === concepto.value.trim().toLowerCase()).pop();
    if (prev) document.getElementById("g-cat").value = prev.cat;
  };
  const selCat = document.getElementById("g-cat");
  let catAnterior = selCat.value;
  selCat.onchange = () => {
    if (selCat.value !== "__nueva__") { catAnterior = selCat.value; return; }
    const n = (prompt("Nombre de la nueva categoría (ej. París):") || "").trim();
    if (!n) { selCat.value = catAnterior; return; }
    const lista = (params.categorias && params.categorias.length) ? params.categorias : (params.categorias = DEFAULT_CATS.map(c => ({ ...c })));
    let c = lista.find(x => quitaTildes(x.n) === quitaTildes(n));
    if (!c) {
      const e = (prompt("Emoji (opcional, déjalo vacío para 🏷️):") || "").trim() || "🏷️";
      let id = slugCat(n); while (lista.some(x => x.id === id)) id += "-2";
      c = { id, n, e }; lista.push(c); params.categorias = lista; saveParams();
    }
    const opt = document.createElement("option");
    opt.value = c.id; opt.textContent = `${c.e} ${c.n}`;
    if (!Array.from(selCat.options).some(o => o.value === c.id)) selCat.insertBefore(opt, selCat.querySelector('[value="__nueva__"]'));
    selCat.value = c.id; catAnterior = c.id;
  };
  const anadir = async () => {
    const importe = parseNum(document.getElementById("g-importe").value);
    const fecha = document.getElementById("g-fecha").value;
    const cat = document.getElementById("g-cat").value;
    if (cat === "__nueva__") { alert("Elige una categoría."); return; }
    let texto = concepto.value.trim();
    if (!importe || importe <= 0) { alert("Escribe un importe mayor que 0."); return; }
    if (!/^\d{4}-\d{2}-\d{2}$/.test(fecha)) { alert("Elige una fecha."); return; }
    if (!texto) texto = catDe(cat).n;
    gastoUltimaCat = cat;
    const nuevo = { id: gastoEditId || Date.now(), fecha, concepto: texto, importe: round2(importe), cat };
    const anioNuevo = fecha.slice(0, 4);
    const tocados = new Set([anioNuevo]);
    if (gastoEditId) {
      Object.keys(gastosByYear).forEach(a => {
        const i = gastosByYear[a].findIndex(g => g.id === gastoEditId);
        if (i >= 0) { gastosByYear[a].splice(i, 1); tocados.add(a); }
      });
    }
    gastosByYear[anioNuevo] = [...(gastosByYear[anioNuevo] || []), nuevo];
    gastoEditId = null;
    gastosView = { y: Number(fecha.slice(0, 4)), m: Number(fecha.slice(5, 7)) - 1 };
    render();
    for (const a of tocados) await saveGastosYear(a);
  };
  document.getElementById("g-add").onclick = anadir;
  ["g-importe", "g-concepto"].forEach(id => document.getElementById(id).addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); anadir(); } }));
  const cancel = document.getElementById("g-cancel");
  if (cancel) cancel.onclick = () => { gastoEditId = null; render(); };

  const buscar = document.getElementById("g-buscar");
  buscar.oninput = () => { gastosFiltro = buscar.value; document.getElementById("g-lista").innerHTML = renderGastosLista(); bindGastosLista(); };
  bindGastosLista();

  const impBtn = document.getElementById("g-import-btn"), impFile = document.getElementById("g-import-file");
  if (impBtn) { impBtn.onclick = () => impFile.click(); impFile.onchange = () => { if (impFile.files[0]) importarGastosArchivo(impFile.files[0]); impFile.value = ""; }; }

  const aplicar = document.getElementById("g-aplicar");
  if (aplicar) aplicar.onclick = async () => {
    const { y, m } = gastosView;
    const { mData, res } = calcAjustesDesdeGastos(y, m, gastosDelMes(y, m));
    if (mData.cerrado) return;
    res.forEach(x => { mData[x.campo] = x.ajuste; });
    getMonthsForYear(y); // asegura el año
    render();
    await saveMonths();
  };
}

function bindGastosLista() {
  document.querySelectorAll("[data-g-edit]").forEach(b => b.onclick = () => {
    gastoEditId = Number(b.dataset.gEdit); render(); window.scrollTo({ top: 0, behavior: "smooth" });
  });
  document.querySelectorAll("[data-g-del]").forEach(b => b.onclick = async () => {
    if (!confirm("¿Borrar este gasto?")) return;
    const id = Number(b.dataset.gDel);
    const tocados = [];
    Object.keys(gastosByYear).forEach(a => {
      const n = gastosByYear[a].length;
      gastosByYear[a] = gastosByYear[a].filter(g => g.id !== id);
      if (gastosByYear[a].length !== n) tocados.push(a);
    });
    render();
    for (const a of tocados) await saveGastosYear(a);
  });
}

    irAHoy();
    ready = true;
    render();
  }
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((e) => console.error("SW error:", e));
  });
}
</script>
