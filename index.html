<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1E2761">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Mi Presupuesto</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Presupuesto">
<style>
  textarea{width:100%; font-size:15px; padding:10px 12px; border-radius:10px; border:1.5px solid var(--border); background:var(--input-bg); color:var(--fg); font-family:inherit; resize:vertical;}
  textarea:focus{outline:2px solid var(--gold); border-color:var(--gold);}
  input:disabled, button:disabled{opacity:.55;}
  .closed-banner{display:flex; align-items:center; gap:10px; background:var(--ok-bg); color:var(--teal); border:1px solid var(--ok-border); border-radius:12px; padding:10px 12px; font-size:12.5px; margin-bottom:12px;}
  .closed-banner span{flex:1; line-height:1.4;}
  .closed-banner .btn{margin-top:0; width:auto; flex:0 0 auto;}
  .cat-row{margin-bottom:10px;}
  .cat-head{display:flex; justify-content:space-between; font-size:12.5px; font-weight:600; color:var(--fg); margin-bottom:4px;}
  .cat-head .cat-val{color:var(--gray); font-weight:600;}
  .cat-bar-bg{background:var(--offwhite); border-radius:999px; height:9px; overflow:hidden;}
  .cat-bar-fill{height:100%; border-radius:999px;}
  .goal-date-row{margin-top:8px;}
  .goal-date-row label{font-size:11.5px; color:var(--gray); font-weight:600; display:flex; align-items:center; gap:8px;}
  .goal-date-row input, #new-goal-date{font-size:13px; padding:5px 8px; border-radius:8px; border:1.5px solid var(--border); background:var(--input-bg); color:var(--fg); font-family:inherit;}
  .goal-pace{font-size:12px; line-height:1.45; margin-top:8px; padding:8px 10px; border-radius:8px; font-weight:600;}
  .goal-pace.ok{background:var(--ok-bg); color:var(--teal);}
  .goal-pace.bad{background:var(--red-bg); color:var(--red);}
  .print-only{display:none;}
  @media print{
    :root, :root[data-dark="1"]{--offwhite:#fff; --surface:#fff; --fg:#1E2761; --gray:#5B6472; --light-gray:#8A94A6; --border:#E3E8F2; --input-bg:#fff; --red-bg:#FCEAEA; --ok-bg:#E7F5F2;}
    nav.tabbar, .no-print, .year-switch button, .goal-delete, #btn-add-goal, .goal-form, .goal-date-row, .save-toast{display:none !important;}
    .print-only{display:block !important;}
    body, #app{background:#fff !important; max-width:none !important; padding-bottom:0 !important;}
    header{position:static !important; -webkit-print-color-adjust:exact; print-color-adjust:exact;}
    .card, .kpi, .goal-card{break-inside:avoid; box-shadow:none;}
    *{-webkit-print-color-adjust:exact; print-color-adjust:exact;}
  }
  .chip-row{display:flex; flex-wrap:wrap; gap:6px;}
  .chip{padding:7px 11px; border-radius:999px; border:1px solid var(--border); background:var(--surface); color:var(--fg); font-size:12.5px; font-weight:600;}
  .chip.on{background:var(--navy); color:#fff; border-color:var(--navy);}
  :root{
    --navy:#1E2761;
    --navy-dark:#141A47;
    --ice:#CADCFC;
    --teal:#1C9C8F;
    --gold:#E3A831;
    --gray:#5B6472;
    --light-gray:#8A94A6;
    --offwhite:#F4F7FD;
    --red:#C0392B;
    --red-bg:#FCEAEA;
    --border:#E3E8F2;
    --fg:var(--navy);
    --surface:#fff;
    --input-bg:#FFFDF3;
    --ok-bg:#E7F5F2;
    --ok-border:#BFE6DF;
    --warn-border:#F3C6C1;
  }
  :root[data-dark="1"]{
    --offwhite:#10141F;
    --fg:#E8ECF7;
    --surface:#1B2130;
    --input-bg:#222940;
    --gray:#AAB3C7;
    --light-gray:#7E869B;
    --border:#2B3347;
    --red-bg:#3A2020;
    --ok-bg:#15332D;
    --ok-border:#1F4A40;
    --warn-border:#5B2E2A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--offwhite);
    color:var(--fg);
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3{font-family:Georgia,"Times New Roman",serif; margin:0;}
  #app{
    max-width:520px;
    margin:0 auto;
    min-height:100vh;
    background:var(--offwhite);
    display:flex;
    flex-direction:column;
    padding-bottom:76px;
  }
  header{
    background:var(--navy);
    color:#fff;
    padding:22px 20px 18px;
    position:sticky;
    top:0;
    z-index:20;
  }
  header h1{font-size:22px;}
  header p{margin:4px 0 0; font-size:12.5px; color:var(--ice); opacity:.9;}

  main{flex:1; padding:16px 14px 8px;}

  .year-switch{
    display:flex; align-items:center; justify-content:center; gap:14px;
    margin:2px 0 10px;
  }
  .year-switch button{
    width:34px; height:34px; border-radius:50%; border:1px solid var(--border);
    background:var(--surface); color:var(--fg); font-size:18px; font-weight:700; line-height:1;
  }
  .year-switch button:active{background:var(--offwhite);}
  .year-switch button:disabled{opacity:.35; pointer-events:none;}
  .year-switch .year-label{font-size:15px; font-weight:800; color:var(--fg); min-width:110px; text-align:center;}

  .month-scroller{
    display:flex; gap:8px; overflow-x:auto; padding:4px 2px 10px;
    -webkit-overflow-scrolling:touch;
  }
  .month-pill{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:999px;
    background:var(--surface);
    border:1px solid var(--border);
    color:var(--fg);
    font-size:13px;
    font-weight:600;
    white-space:nowrap;
  }
  .month-pill.active{background:var(--navy); color:#fff; border-color:var(--navy);}
  .month-pill.filled:not(.active){border-color:var(--teal); color:var(--teal);}

  .card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
  }
  .card h3{font-size:15px; color:var(--fg); margin-bottom:10px;}
  .field{margin-bottom:12px;}
  .field label{
    display:block; font-size:12.5px; color:var(--gray); margin-bottom:5px; font-weight:600;
  }
  .field .hint{font-size:11px; color:var(--light-gray); font-weight:400; display:block; margin-top:2px;}  input[type=number], select{
    width:100%;
    font-size:16px;
    padding:11px 12px;
    border-radius:10px;
    border:1.5px solid var(--border);
    background:var(--input-bg);
    color:var(--fg);
    font-weight:600;
  }
  input[type=number]:focus, select:focus{outline:2px solid var(--gold); border-color:var(--gold);}
  input::placeholder{color:var(--light-gray); font-weight:400;}

  .result-row{
    display:flex; justify-content:space-between; align-items:center;
    padding:8px 0; border-bottom:1px dashed var(--border); font-size:13.5px;
  }
  .result-row:last-child{border-bottom:none;}
  .result-row .label{color:var(--gray);}
  .result-row .value{font-weight:700; color:var(--fg);}

  .result-row.expandable-head{cursor:pointer; user-select:none;}
  .result-row.expandable-head .label{display:flex; align-items:center; gap:6px;}
  .arrow{
    display:inline-block; font-size:10px; color:var(--light-gray);
    transition:transform .18s ease; transform:rotate(0deg);
  }
  .arrow.open{transform:rotate(90deg); color:var(--fg);}
  .sub-rows{
    max-height:0; overflow:hidden; transition:max-height .2s ease;
  }
  .sub-rows.open{max-height:240px;}
  .result-row.sub{padding:6px 0 6px 16px; font-size:12px; border-bottom:none;}
  .result-row.sub .label{color:var(--light-gray);}
  .result-row.sub .value{color:var(--gray); font-weight:600;}

  .dest-grid{display:flex; flex-direction:column; gap:10px; margin-top:4px;}
  .dest-card{
    border-radius:12px; padding:14px; color:#fff; display:flex; justify-content:space-between; align-items:center;
  }
  .dest-card .name{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; opacity:.9;}
  .dest-card .amount{font-size:20px; font-weight:800; margin-top:2px;}
  .dest-card.ing{background:var(--navy);}
  .dest-card.tr{background:var(--teal);}
  .dest-card.san{background:var(--gold);}
  .dest-card.san.negative{background:var(--red);}

  .warn-banner{
    background:var(--red-bg); color:var(--red); border:1px solid var(--warn-border);
    border-radius:10px; padding:10px 12px; font-size:12.5px; margin-top:10px; font-weight:600;
  }
  .ok-banner{
    background:var(--ok-bg); color:var(--teal); border:1px solid var(--ok-border);
    border-radius:10px; padding:10px 12px; font-size:12px; margin-top:10px;
  }
  .compare-row{
    font-size:12.5px; font-weight:700; margin-top:10px; padding:8px 4px; text-align:center;
  }
  .compare-row.up{color:var(--teal);}
  .compare-row.down{color:var(--red);}
  .compare-row.equal{color:var(--light-gray); font-weight:600;}

  .kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
  .kpi{
    background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:12px;
  }
  .kpi .big{font-size:19px; font-weight:800; color:var(--fg);}
  .kpi .lbl{font-size:11px; color:var(--gray); margin-top:2px; line-height:1.3;}

  .goal-card{border:1px solid var(--border); border-radius:12px; padding:12px; margin-bottom:10px;}
  .goal-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .goal-name{font-weight:700; font-size:14px; color:var(--fg);}
  .goal-delete{background:none; border:none; color:var(--light-gray); font-size:14px; padding:2px 6px; line-height:1;}
  .goal-bar-bg{background:var(--offwhite); border-radius:999px; height:10px; overflow:hidden;}
  .goal-bar-fill{background:linear-gradient(90deg, var(--gold), var(--teal)); height:100%; border-radius:999px; transition:width .3s ease;}
  .goal-sub{font-size:11.5px; color:var(--gray); margin-top:6px; font-weight:600;}
  .goal-form input{margin-bottom:8px;}

  table{width:100%; border-collapse:collapse; font-size:12.5px;}
  th,td{padding:7px 6px; text-align:right; border-bottom:1px solid var(--border);}
  th:first-child,td:first-child{text-align:left;}
  th{color:var(--gray); font-size:10.5px; text-transform:uppercase; letter-spacing:.02em;}
  td{color:var(--fg); font-weight:600;}
  .table-wrap{overflow-x:auto; border-radius:10px;}

  .section-title{font-size:13px; font-weight:700; color:var(--gray); text-transform:uppercase; letter-spacing:.03em; margin:18px 0 8px;}
  .section-title:first-child{margin-top:0;}

  .btn{
    width:100%; padding:12px; border-radius:10px; border:none; font-size:14px; font-weight:700;
    background:var(--navy); color:#fff; margin-top:6px;
  }
  .btn.secondary{background:var(--surface); color:var(--red); border:1.5px solid var(--red);}
  .btn.small{width:auto; padding:8px 14px; font-size:12.5px;}

  .dark-switch{
    width:46px; height:26px; border-radius:999px; border:none; background:var(--border);
    position:relative; padding:0; flex:0 0 auto; transition:background .2s ease;
  }
  .dark-switch.on{background:var(--navy);}
  .dark-switch-knob{
    position:absolute; top:3px; left:3px; width:20px; height:20px; border-radius:50%;
    background:#fff; transition:transform .2s ease; box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  .dark-switch.on .dark-switch-knob{transform:translateX(20px);}

  nav.tabbar{
    position:fixed; bottom:0; left:0; right:0;
    max-width:520px; margin:0 auto;
    background:var(--surface); border-top:1px solid var(--border);
    display:flex; z-index:30;
    padding-bottom:env(safe-area-inset-bottom, 0);
  }
  nav.tabbar button{
    flex:1; background:none; border:none; padding:12px 4px 10px; font-size:11.5px;
    color:var(--light-gray); font-weight:600; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  nav.tabbar button .ic{font-size:19px; line-height:1;}
  nav.tabbar button.active{color:var(--fg);}
  nav.tabbar button.active .ic{color:var(--gold);}

  .two-col{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .loading{padding:40px 20px; text-align:center; color:var(--gray); font-size:13px;}
  .save-toast{
    position:fixed; bottom:82px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--navy); color:#fff; padding:8px 16px; border-radius:999px; font-size:12px;
    opacity:0; transition:opacity .2s, transform .2s; z-index:40; pointer-events:none;
  }
  .save-toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  #auth-screen{
    display:none;
    min-height:100vh;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .auth-card{
    width:100%; max-width:360px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:28px 24px;
    text-align:center;
  }
  .auth-card h1{font-size:22px; color:var(--fg); margin-bottom:6px;}
  .auth-card p{font-size:13px; color:var(--gray); margin:0 0 18px; line-height:1.4;}
  .auth-card input{
    width:100%; padding:12px 14px; margin-bottom:10px;
    border:1px solid var(--border); border-radius:10px;
    font-size:15px; font-family:inherit; color:var(--fg);
  }
  .auth-card .btn{width:100%; margin-top:4px;}
  .link-btn{
    background:none; border:none; color:var(--fg); font-size:12.5px; font-weight:600;
    margin-top:12px; padding:4px; text-decoration:underline; width:100%;
  }
  #auth-error{font-size:12.5px; color:var(--red); margin-top:10px; display:none;}
  #auth-loading{font-size:12.5px; color:var(--light-gray); margin-top:10px;}
</style>
</head>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<body>
<div id="auth-screen">
  <div class="auth-card">
    <h1>Mi Presupuesto</h1>
    <p>Inicia sesión para guardar tus datos en la nube y verlos desde cualquier dispositivo.</p>
    <input type="email" id="auth-email" placeholder="Correo electrónico" autocomplete="username">
    <input type="password" id="auth-password" placeholder="Contraseña (mín. 6 caracteres)" autocomplete="current-password">
    <button class="btn" id="auth-login">Entrar</button>
    <button class="btn secondary" id="auth-signup">Crear cuenta nueva</button>
    <button class="link-btn" id="auth-forgot" type="button">¿Olvidaste tu contraseña?</button>
    <p id="auth-error"></p>
    <p id="auth-loading" style="display:none;">Conectando…</p>
  </div>
</div>
<div id="app">
  <header>
    <h1>Mi Presupuesto</h1>
    <p id="header-sub">Cargando…</p>
  </header>
  <main id="main"><div class="loading">Cargando tus datos…</div></main>
  <nav class="tabbar">
    <button data-tab="mensual" class="active"><span class="ic">📅</span>Mensual</button>
    <button data-tab="resumen"><span class="ic">📊</span>Resumen</button>
    <button data-tab="ajustes"><span class="ic">⚙️</span>Ajustes</button>
  </nav>
</div>
<div class="save-toast" id="toast">Guardado</div>

<script>
const MONTHS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

// ---------- Firebase (login + guardado en la nube) ----------
// Rellena esto con la configuración de TU proyecto de Firebase (Configuración del
// proyecto → General → "Tus apps" → app web). Es gratis. Mientras esté sin rellenar,
// la app sigue funcionando como antes, guardando solo en este navegador.
const firebaseConfig = {
  apiKey: "AIzaSyByqYF14EYTyjpng4hNtJfsVokcMUjaZaU",
  authDomain: "presupuesto-8d7d9.firebaseapp.com",
  projectId: "presupuesto-8d7d9",
  storageBucket: "presupuesto-8d7d9.firebasestorage.app",
  messagingSenderId: "619565526766",
  appId: "1:619565526766:web:de629d1f7743c730540dff",
};
const FIREBASE_CONFIGURED = firebaseConfig.apiKey !== "TU_API_KEY";
let auth = null, db = null, currentUser = null;
if (FIREBASE_CONFIGURED) {
  firebase.initializeApp(firebaseConfig);
  auth = firebase.auth();
  db = firebase.firestore();
}

function traducirErrorAuth(code) {
  const map = {
    "auth/invalid-email": "Ese correo no es válido.",
    "auth/user-not-found": "No existe ninguna cuenta con ese correo.",
    "auth/wrong-password": "Contraseña incorrecta.",
    "auth/invalid-credential": "Correo o contraseña incorrectos.",
    "auth/email-already-in-use": "Ya existe una cuenta con ese correo. Prueba a entrar en vez de crear una nueva.",
    "auth/weak-password": "La contraseña necesita al menos 6 caracteres.",
    "auth/missing-password": "Escribe una contraseña.",
    "auth/too-many-requests": "Demasiados intentos. Espera un poco y vuelve a probar.",
    "auth/missing-email": "Escribe primero tu correo electrónico ahí arriba.",
  };
  return map[code] || "Ha ocurrido un error. Inténtalo de nuevo.";
}

function showAuthScreen() {
  document.getElementById("auth-screen").style.display = "flex";
  document.getElementById("app").style.display = "none";
}
function showApp() {
  document.getElementById("auth-screen").style.display = "none";
  document.getElementById("app").style.display = "flex";
}

function setupAuthHandlers() {
  const emailEl = document.getElementById("auth-email");
  const passEl = document.getElementById("auth-password");
  const errEl = document.getElementById("auth-error");
  const loadingEl = document.getElementById("auth-loading");

  function setBusy(busy) {
    loadingEl.style.display = busy ? "block" : "none";
    document.getElementById("auth-login").disabled = busy;
    document.getElementById("auth-signup").disabled = busy;
  }
  function showErr(code) {
    errEl.textContent = traducirErrorAuth(code);
    errEl.style.display = "block";
  }

  document.getElementById("auth-login").onclick = async () => {
    errEl.style.display = "none";
    setBusy(true);
    try {
      await auth.signInWithEmailAndPassword(emailEl.value.trim(), passEl.value);
    } catch (e) { showErr(e.code); } finally { setBusy(false); }
  };
  document.getElementById("auth-signup").onclick = async () => {
    errEl.style.display = "none";
    setBusy(true);
    try {
      await auth.createUserWithEmailAndPassword(emailEl.value.trim(), passEl.value);
    } catch (e) { showErr(e.code); } finally { setBusy(false); }
  };
  document.getElementById("auth-forgot").onclick = async () => {
    errEl.style.display = "none";
    errEl.style.color = "";
    const email = emailEl.value.trim();
    if (!email) { showErr("auth/missing-email"); return; }
    setBusy(true);
    try {
      await auth.sendPasswordResetEmail(email);
      errEl.style.color = "var(--teal)";
      errEl.textContent = "Te hemos enviado un correo a " + email + " para que elijas una contraseña nueva.";
      errEl.style.display = "block";
    } catch (e) {
      errEl.style.color = "";
      showErr(e.code);
    } finally { setBusy(false); }
  };
}

const DEFAULT_PARAMS = {
  salarioBase: 1500,
  alquiler: 300,
  compra: 100,
  gasolina: 100,
  suscripciones: 32.95,
  peluqueria: 10,
  inversion: 500,
  ahorroFijo: 100,
  seguroCoche: 150,
  rodaje: 60,
  mesesSeguro: ["Abril","Mayo"],
  mesRodaje: "Abril",
  colchon: 10000,
  saldoSantander: 0,
  saldoTradeRepublic: 0,
  extras: [],       // gastos fijos personalizados: [{id, nombre, importe}]
  tema: "navy",      // tema de color elegido
  modoOscuro: false, // modo oscuro
  historial: {},     // cambios de importes con fecha: { campo: [{desde, valor}] }
};

const THEMES = {
  navy:    { nombre: "Clásico",  navy: "#1E2761", navyDark: "#141A47", teal: "#1C9C8F", gold: "#E3A831", ice: "#CADCFC" },
  bosque:  { nombre: "Bosque",   navy: "#1B4332", navyDark: "#0F2A20", teal: "#40916C", gold: "#D4A24C", ice: "#D8F3DC" },
  burdeos: { nombre: "Burdeos",  navy: "#5C1A2B", navyDark: "#3D0F1C", teal: "#B5654A", gold: "#D9A441", ice: "#F3D9DF" },
  lavanda: { nombre: "Lavanda",  navy: "#3B2E58", navyDark: "#26203B", teal: "#8E7CC3", gold: "#E0A96D", ice: "#E6DEF5" },
  oceano:  { nombre: "Océano",   navy: "#0B3D5C", navyDark: "#072940", teal: "#2E9CCA", gold: "#E8B84B", ice: "#CFEAF7" },
};

function applyTheme(temaId) {
  const t = THEMES[temaId] || THEMES.navy;
  const root = document.documentElement.style;
  root.setProperty("--navy", t.navy);
  root.setProperty("--navy-dark", t.navyDark);
  root.setProperty("--teal", t.teal);
  root.setProperty("--gold", t.gold);
  root.setProperty("--ice", t.ice);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", params.modoOscuro ? "#10141F" : t.navy);
}

function applyDarkMode(on) {
  document.documentElement.setAttribute("data-dark", on ? "1" : "0");
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta && on) meta.setAttribute("content", "#10141F");
  else if (meta) { const t = THEMES[params.tema] || THEMES.navy; meta.setAttribute("content", t.navy); }
}

let params = { ...DEFAULT_PARAMS };
function blankYearMonths() {
  return MONTHS.map(m => ({ mes: m, salario: null, ajusteOcio: null, ajusteGasolina: null, ajusteCompra: null, ingresosExtra: null, gastoExcepcional: null, gastoExcepcionalNota: null, gastosExcepcionales: [], nota: "", cerrado: false }));
}

let monthsDataByYear = {}; // { "2026": [ {mes, salario, ...} x12 ], "2027": [...] }
let activeYear = new Date().getFullYear();

function getMonthsForYear(year) {
  const key = String(year);
  if (!monthsDataByYear[key]) monthsDataByYear[key] = blankYearMonths();
  return monthsDataByYear[key];
}

let monthsData = getMonthsForYear(activeYear); // referencia al año activo; cambia con changeYear()

function changeYear(newYear) {
  activeYear = newYear;
  monthsData = getMonthsForYear(activeYear);
  render();
}

// Suma de lo enviado a cada cuenta en TODOS los años con datos (para saldos y objetivos,
// que no dependen del año que estés mirando en pantalla).
function sumAllYears(fieldFn) {
  let total = 0;
  Object.values(monthsDataByYear).forEach(yearMonths => {
    yearMonths.forEach(m => {
      const r = calcMonth(m);
      if (r) total += fieldFn(r);
    });
  });
  return total;
}

// Contribución de los años ANTERIORES al indicado (para arrastrar saldos año a año en Resumen).
function priorYearsContribution(year) {
  let santander = 0, tradeRepublic = 0;
  Object.keys(monthsDataByYear).forEach(y => {
    if (Number(y) < year) {
      monthsDataByYear[y].forEach(m => {
        const r = calcMonth(m);
        if (r) { santander += r.totalSantander; tradeRepublic += r.totalTradeRepublic; }
      });
    }
  });
  return { santander, tradeRepublic };
}

// Mes cronológicamente anterior al indicado (cruza al año previo si hace falta),
// para la comparativa "vs mes anterior" en la pestaña Mensual.
function getPreviousMonthInfo(year, monthIdx) {
  let y = year, idx = monthIdx - 1;
  if (idx < 0) { idx = 11; y = year - 1; }
  const yearMonths = monthsDataByYear[String(y)];
  const mData = yearMonths ? yearMonths[idx] : null;
  const label = MONTHS[idx] + (y !== year ? ` ${y}` : "");
  return { mData, label };
}

// ---------- Storage ----------
function hasClaudeStorage() {
  return typeof window.storage !== "undefined" && window.storage && typeof window.storage.get === "function";
}

async function storageGet(key) {
  if (FIREBASE_CONFIGURED && currentUser) {
    try {
      const doc = await db.collection("presupuestos").doc(currentUser.uid).get();
      const data = doc.exists ? doc.data() : {};
      return data[key] !== undefined ? data[key] : null;
    } catch (e) { console.error("Error leyendo de Firestore", e); return null; }
  }
  if (hasClaudeStorage()) {
    try {
      const r = await window.storage.get(key, false);
      return r && r.value ? r.value : null;
    } catch (e) { return null; }
  }
  try { return localStorage.getItem(key); } catch (e) { return null; }
}

async function storageSet(key, value) {
  if (FIREBASE_CONFIGURED && currentUser) {
    try {
      await db.collection("presupuestos").doc(currentUser.uid).set({ [key]: value }, { merge: true });
      return true;
    } catch (e) { console.error("Error guardando en Firestore", e); return false; }
  }
  if (hasClaudeStorage()) {
    try { await window.storage.set(key, value, false); return true; }
    catch (e) { console.error("Error guardando en Claude", e); return false; }
  }
  try { localStorage.setItem(key, value); return true; }
  catch (e) { console.error("Error guardando en el navegador", e); return false; }
}

async function loadData() {
  const p = await storageGet("finanzas_parametros");
  if (p) { try { params = { ...DEFAULT_PARAMS, ...JSON.parse(p) }; } catch (e) {} }
  const m = await storageGet("finanzas_meses");
  if (m) {
    try {
      const parsed = JSON.parse(m);
      if (Array.isArray(parsed)) {
        // Formato antiguo (un solo año sin distinguir cuál) → lo migramos al año en curso.
        monthsDataByYear = { [String(new Date().getFullYear())]: parsed };
      } else {
        monthsDataByYear = parsed;
      }
    } catch (e) {}
  }
  migrarExcepcionales();
  monthsData = getMonthsForYear(activeYear);
  const g = await storageGet("finanzas_objetivos");
  if (g) { try { goals = JSON.parse(g); } catch (e) {} }
  applyTheme(params.tema);
  applyDarkMode(!!params.modoOscuro);
}

// ---------- Cálculo por mes (misma lógica que la hoja de cálculo) ----------
// Lista de gastos excepcionales de un mes (compatible con el formato antiguo de un solo gasto).
function excepcionalesDe(mData) {
  if (Array.isArray(mData.gastosExcepcionales) && mData.gastosExcepcionales.length) return mData.gastosExcepcionales;
  const v = Number(mData.gastoExcepcional);
  if ((!Array.isArray(mData.gastosExcepcionales) || !mData.gastosExcepcionales.length) && v) {
    return [{ id: 0, concepto: mData.gastoExcepcionalNota || "", importe: v }];
  }
  return [];
}
function migrarExcepcionales() {
  Object.values(monthsDataByYear).forEach(arr => arr.forEach(m => {
    if (!Array.isArray(m.gastosExcepcionales)) m.gastosExcepcionales = [];
    if (!m.gastosExcepcionales.length && Number(m.gastoExcepcional)) {
      m.gastosExcepcionales = [{ id: Date.now() + Math.random(), concepto: m.gastoExcepcionalNota || "", importe: Number(m.gastoExcepcional) }];
    }
    m.gastoExcepcional = null; m.gastoExcepcionalNota = null;
  }));
}
function extraAplica(ex, mes) {
  return !Array.isArray(ex.meses) || ex.meses.length === 0 || ex.meses.includes(mes);
}
function extraMesesTexto(ex) {
  if (!Array.isArray(ex.meses) || ex.meses.length === 0 || ex.meses.length === 12) return "Todos los meses";
  return MONTHS.filter(m => ex.meses.includes(m)).map(m => m.slice(0,3)).join(", ");
}

const CAMPOS_HISTORIAL = ["salarioBase","alquiler","compra","gasolina","suscripciones","peluqueria","inversion","ahorroFijo","seguroCoche","rodaje"];
function yearOf(mData) {
  if (mData._anio) return mData._anio;
  for (const y of Object.keys(monthsDataByYear)) if (monthsDataByYear[y].includes(mData)) return Number(y);
  return activeYear;
}
function periodKey(year, mesIdx) { return year * 100 + mesIdx + 1; }
// Valor de un importe en un mes concreto, teniendo en cuenta los cambios con fecha.
function pv(campo, mData) {
  const h = params.historial && params.historial[campo];
  if (!h || !h.length) return params[campo];
  const key = periodKey(yearOf(mData), MONTHS.indexOf(mData.mes));
  let val = h[0].valor;
  for (const e of h) if (e.desde <= key) val = e.valor;
  return val;
}

function calcMonth(mData) {
  const salario = mData.salario;
  if (salario === null || salario === undefined || salario === "") return null;

  const fijosEsenciales = pv("alquiler", mData) + pv("compra", mData) + pv("gasolina", mData); // usa la gasolina presupuestada (referencia)
  const subsPelu = pv("suscripciones", mData) + pv("peluqueria", mData);
  const inversion = pv("inversion", mData);
  const ahorroFijo = pv("ahorroFijo", mData);

  let ocasional = 0;
  if (params.mesesSeguro.includes(mData.mes)) ocasional += pv("seguroCoche", mData);
  if (params.mesRodaje === mData.mes) ocasional += pv("rodaje", mData);
  const extrasTotal = (params.extras || []).filter(ex => extraAplica(ex, mData.mes)).reduce((acc, ex) => acc + (Number(ex.importe) || 0), 0);
  ocasional += extrasTotal;

  const totalFijosOcasional = fijosEsenciales + subsPelu + inversion + ahorroFijo + ocasional;
  const ocioPresupuestado = Math.min(salario, pv("salarioBase", mData)) - totalFijosOcasional;
  const extraSantander = Math.max(salario - pv("salarioBase", mData), 0);

  const ajusteOcio = (mData.ajusteOcio === null || mData.ajusteOcio === undefined || mData.ajusteOcio === "") ? 0 : Number(mData.ajusteOcio);
  const ocioRealGastado = ocioPresupuestado + ajusteOcio;

  const ajusteGasolina = (mData.ajusteGasolina === null || mData.ajusteGasolina === undefined || mData.ajusteGasolina === "") ? 0 : Number(mData.ajusteGasolina);
  const gastoRealGasolina = pv("gasolina", mData) + ajusteGasolina;
  const ajusteCompra = (mData.ajusteCompra === null || mData.ajusteCompra === undefined || mData.ajusteCompra === "") ? 0 : Number(mData.ajusteCompra);
  const gastoRealCompra = pv("compra", mData) + ajusteCompra;
  const fijosEsencialesReal = pv("alquiler", mData) + gastoRealCompra + gastoRealGasolina; // lo que de verdad sale por ING

  const ajusteSantander = -ajusteOcio - ajusteGasolina - ajusteCompra;
  const ingresosExtra = (mData.ingresosExtra === null || mData.ingresosExtra === undefined || mData.ingresosExtra === "") ? 0 : Number(mData.ingresosExtra);
  const listaExc = excepcionalesDe(mData);
  const gastoExcepcional = listaExc.reduce((a, g) => a + (Number(g.importe) || 0), 0);
  const gastoExcepcionalNota = listaExc.map(g => g.concepto).filter(Boolean).join(", ");

  const totalSantander = ahorroFijo + extraSantander + ajusteSantander + ingresosExtra - gastoExcepcional;
  const totalTradeRepublic = inversion;
  const totalING = fijosEsencialesReal + subsPelu + ocasional + ocioRealGastado + gastoExcepcional;

  const comprobacion = (salario + ingresosExtra) - (totalSantander + totalTradeRepublic + totalING);

  return {
    fijosEsenciales, fijosEsencialesReal, subsPelu, inversion, ahorroFijo, ocasional, extrasTotal,
    gastoRealGasolina, ajusteGasolina, gastoRealCompra, ajusteCompra, ingresosExtra, gastoExcepcional,
    gastoExcepcionalNota, gastosExcepcionales: listaExc,
    totalFijosOcasional, ocioPresupuestado, extraSantander, ajuste: ajusteOcio,
    ocioRealGastado, ajusteSantander, totalSantander, totalTradeRepublic,
    totalING, comprobacion,
  };
}

// ---------- Render ----------
function render() {
  document.getElementById("header-sub").textContent =
    activeTab === "mensual" ? "Introduce tu salario del mes" :
    activeTab === "resumen" ? "Tu año de un vistazo" : "Parámetros de tu presupuesto";

  document.querySelectorAll("nav.tabbar button").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === activeTab);
  });

  const main = document.getElementById("main");
  if (activeTab === "mensual") main.innerHTML = renderMensual();
  else if (activeTab === "resumen") main.innerHTML = renderResumen();
  else main.innerHTML = renderAjustes();

  attachHandlers();

  // Centra la lista de meses en el mes seleccionado (si no, parece que empieza en enero).
  const sc = document.querySelector(".month-scroller"), pill = sc && sc.querySelector(".month-pill.active");
  if (sc && pill) sc.scrollLeft = pill.offsetLeft - (sc.clientWidth - pill.offsetWidth) / 2;
}

function renderYearSwitch() {
  const hasData = (monthsDataByYear[String(activeYear)] || []).some(m => m.salario !== null && m.salario !== undefined && m.salario !== "");
  const atMin = activeYear <= new Date().getFullYear();
  return `
    <div class="year-switch">
      <button id="year-prev" aria-label="Año anterior" ${atMin ? "disabled" : ""}>‹</button>
      <span class="year-label">${activeYear}${hasData ? "" : " (sin datos)"}</span>
      <button id="year-next" aria-label="Año siguiente">›</button>
    </div>
  `;
}

function renderMensual() {
  const pills = MONTHS.map((m, i) => {
    const filled = monthsData[i].salario !== null && monthsData[i].salario !== undefined && monthsData[i].salario !== "";
    const cls = ["month-pill"];
    if (i === activeMonthIdx) cls.push("active");
    else if (filled) cls.push("filled");
    return `<button class="${cls.join(" ")}" data-month="${i}">${m.slice(0,3)}${monthsData[i].cerrado ? " 🔒" : ""}</button>`;
  }).join("");

  const mData = monthsData[activeMonthIdx];
  const mesVacio = mData.salario === null || mData.salario === undefined || mData.salario === "";
  const sinAjustesPropios = !mData.ajusteOcio && !mData.ajusteGasolina && !mData.ajusteCompra;
  const { mData: prevForCopy, label: prevLabelForCopy } = getPreviousMonthInfo(activeYear, activeMonthIdx);
  const hayAjustesQueCopiar = prevForCopy && (prevForCopy.ajusteOcio || prevForCopy.ajusteGasolina || prevForCopy.ajusteCompra);
  const copyButtonHtml = (mesVacio && sinAjustesPropios && hayAjustesQueCopiar) ? `
    <button class="btn secondary" id="btn-copy-prev" type="button" style="margin-bottom:14px;">📋 Copiar ajustes de ${prevLabelForCopy}</button>
  ` : "";

  return `
    ${renderYearSwitch()}
    <div class="month-scroller">${pills}</div>
    ${mData.cerrado ? `<div class="closed-banner">🔒 <span><strong>${mData.mes} está cerrado.</strong> Los importes están bloqueados para no tocarlos sin querer. Si te faltó algo, puedes reabrirlo.</span><button class="btn small" id="btn-reopen" type="button">Reabrir mes</button></div>` : ""}
    <div class="card">
      ${copyButtonHtml}
      <div class="field">
        <label>Salario recibido en ${mData.mes}</label>
        <input type="number" inputmode="decimal" step="0.01" id="input-salario" placeholder="Ej. 1500" value="${mData.salario ?? ""}">
      </div>
      <div class="field">
        <label>Ajuste de ocio <span class="hint">Positivo si gastaste de más · negativo si te sobró</span></label>
        <input type="number" inputmode="decimal" step="0.01" id="input-ajuste" placeholder="Ej. 50 o -30" value="${mData.ajusteOcio ?? ""}">
      </div>
      <div class="field">
        <label>Ajuste de gasolina <span class="hint">Presupuesto medio 100 € · positivo si gastaste de más, negativo si gastaste menos</span></label>
        <input type="number" inputmode="decimal" step="0.01" id="input-ajuste-gasolina" placeholder="Ej. -30 si gastaste 70" value="${mData.ajusteGasolina ?? ""}">
      </div>
      <div class="field">
        <label>Ajuste de compra <span class="hint">Presupuesto medio 100 € · positivo si gastaste de más, negativo si gastaste menos</span></label>
        <input type="number" inputmode="decimal" step="0.01" id="input-ajuste-compra" placeholder="Ej. -20 si gastaste 80" value="${mData.ajusteCompra ?? ""}">
      </div>
      <div class="field">
        <label>Ingresos extra <span class="hint">Regalos u otros ingresos puntuales · va directo a Santander · 0 € por defecto</span></label>
        <input type="number" inputmode="decimal" step="0.01" id="input-ingresos-extra" placeholder="0" value="${mData.ingresosExtra ?? ""}">
      </div>
      <div class="field">
        <label>Gastos excepcionales <span class="hint">Imprevistos (médico, reparación, multa...) · restan de Santander este mes · puedes añadir varios</span></label>
        ${excepcionalesDe(mData).map(g => `
          <div class="result-row">
            <span class="label">${escapeHtml(g.concepto || "Sin concepto")}</span>
            <span class="value" style="display:flex; align-items:center; gap:8px;">${euro(Number(g.importe) || 0)}
              <button class="goal-delete" data-exc-del="${g.id}" aria-label="Eliminar gasto">✕</button></span>
          </div>`).join("")}
        <div class="two-col" style="margin-top:8px;">
          <input type="text" id="exc-concepto" placeholder="Concepto (Ej. Médico)">
          <input type="number" inputmode="decimal" step="0.01" id="exc-importe" placeholder="Importe">
        </div>
        <button class="btn small secondary" id="btn-add-exc" style="margin-top:8px; color:var(--fg); border-color:var(--border);">+ Añadir gasto excepcional</button>
      </div>
      <div class="field">
        <label>Nota del mes <span class="hint">Para acordarte luego (vacaciones, cambio de seguro...) · se puede editar aunque el mes esté cerrado</span></label>
        <textarea id="input-nota" rows="2" placeholder="Ej. Mes de vacaciones">${escapeHtml(mData.nota || "")}</textarea>
      </div>
      ${(!mData.cerrado && !mesVacio) ? `<button class="btn" id="btn-close-month" type="button">🔒 Cerrar ${mData.mes}</button>` : ""}
    </div>
    <div id="results-container">${computeResultsHtml(mData)}</div>
  `;
}

function computeResultsHtml(mData) {
  const r = calcMonth(mData);
  if (!r) {
    return `<div class="card"><p style="color:var(--gray); font-size:13px; margin:0;">Escribe el salario de ${mData.mes} para ver el reparto.</p></div>`;
  }
  const sanNeg = r.totalSantander < 0;
  return `
    <div class="card">
      <h3>Desglose de ${mData.mes}</h3>
      <div class="result-row expandable-head" id="toggle-fijos">
        <span class="label">Gastos fijos esenciales <span class="arrow ${expandedFijos ? "open" : ""}">▶</span></span>
        <span class="value">${euro(r.fijosEsencialesReal)}</span>
      </div>
      <div class="sub-rows ${expandedFijos ? "open" : ""}" id="subrows-fijos">
        <div class="result-row sub"><span class="label">Alquiler</span><span class="value">${euro(pv("alquiler", mData))}</span></div>
        <div class="result-row sub"><span class="label">Compra (real este mes)</span><span class="value">${euro(r.gastoRealCompra)}</span></div>
        <div class="result-row sub"><span class="label">Gasolina (real este mes)</span><span class="value">${euro(r.gastoRealGasolina)}</span></div>
      </div>
      <div class="result-row"><span class="label">Suscripciones + peluquería</span><span class="value">${euro(r.subsPelu)}</span></div>

      <div class="result-row expandable-head" id="toggle-extras">

      </div>
      <div class="sub-rows ${expandedExtras ? "open" : ""}">

      </div>` : ""}
      <div class="result-row"><span class="label">Ocio presupuestado</span><span class="value">${euro(r.ocioPresupuestado)}</span></div>

    </div>

        <div class="dest-card tr"><span class="name">Trade Republic · inversión</span><span class="amount">${euro0(r.totalTradeRepublic)}</span></div>
        <div class="dest-card san ${sanNeg ? "negative" : ""}"><span class="name">Santander · ahorro</span><span class="amount">${euro0(r.totalSantander)}</span></div>
      </div>
      ${sanNeg
        ? `<div class="warn-banner">⚠️ Este mes el sobregasto de ocio, compra, gasolina y/o un gasto excepcional supera lo que ibas a meter en Santander. Tendrás que sacar dinero de lo ya ahorrado allí.</div>`
        : `<div class="ok-banner">Comprobación: ${euro(r.comprobacion)} (debe ser 0 €)</div>`}
      ${renderComparisonRow(r)}
    </div>
  `;
}

function renderComparisonRow(r) {
  const { mData: prevMData, label: prevLabel } = getPreviousMonthInfo(activeYear, activeMonthIdx);
  const prevR = prevMData ? calcMonth(prevMData) : null;
  if (!prevR) return "";
  const delta = r.totalSantander - prevR.totalSantander;
  if (Math.abs(delta) < 0.005) {
    return `<div class="compare-row equal">= Igual que en ${prevLabel} (${euro0(r.totalSantander)} a Santander)</div>`;
  }
  const cls = delta > 0 ? "up" : "down";
  const arrow = delta > 0 ? "▲" : "▼";
  const word = delta > 0 ? "más" : "menos";
  return `<div class="compare-row ${cls}">${arrow} ${euro(Math.abs(delta))} ${word} a Santander que en ${prevLabel}</div>`;
}

function renderResumen() {
  const filled = monthsData.map(calcMonth);
  const sum = (fn) => filled.reduce((acc, r) => r ? acc + fn(r) : acc, 0);
  const count = filled.filter(Boolean).length;

  const salarioTotal = monthsData.reduce((acc, m) => acc + (m.salario ? Number(m.salario) : 0), 0);
  const fijosTotal = sum(r => r.fijosEsencialesReal + r.subsPelu + r.inversion + r.ocasional);
  const inversionTotal = sum(r => r.totalTradeRepublic);
  const santanderTotal = sum(r => r.totalSantander);
  const ingTotal = sum(r => r.totalING);
  const ocioMedio = count ? sum(r => r.ocioPresupuestado) / count : 0;
  const ratioFijos = salarioTotal ? fijosTotal / salarioTotal : 0;
  const ratioInversion = salarioTotal ? inversionTotal / salarioTotal : 0;
  const fijosEsencialesMes = params.alquiler + params.compra + params.gasolina;
  const mesesColchon = fijosEsencialesMes ? params.colchon / fijosEsencialesMes : 0;

  // Los saldos arrastran lo acumulado en años anteriores, no empiezan de cero cada enero.

  let saldoTR = params.saldoTradeRepublic + prior.tradeRepublic;
  MONTHS.forEach((m, i) => {
    const r = filled[i];
    if (r) { saldoSan += r.totalSantander; saldoTR += r.totalTradeRepublic; }
    rows += `<tr><td>${m.slice(0,3)}</td><td>${r ? euro0(r.totalSantander) : "—"}</td><td>${euro0(saldoSan)}</td><td>${r ? euro0(r.totalTradeRepublic) : "—"}</td><td>${euro0(saldoTR)}</td></tr>`;
  });

  // El saldo "actual" para los objetivos es el de TODOS los años con datos, no solo el año que estás mirando.
  const saldoSantanderActual = params.saldoSantander + sumAllYears(r => r.totalSantander);

  return `
    <h2 class="print-only" style="margin:0 0 10px;">Resumen ${activeYear}</h2>
    ${renderYearSwitch()}
    <div class="section-title">KPIs del año${count < 12 ? ` (${count} de 12 meses)` : ""}</div>
    <div class="kpi-grid">
      <div class="kpi"><div class="big">${euro0(salarioTotal)}</div><div class="lbl">Salario total del año</div></div>
      <div class="kpi"><div class="big">${pct(ratioInversion)}</div><div class="lbl">Tasa de inversión</div></div>
      <div class="kpi"><div class="big">${pct(ratioFijos)}</div><div class="lbl">Fijos+inversión / ingresos</div></div>
      <div class="kpi"><div class="big">${euro(ocioMedio)}</div><div class="lbl">Ocio presupuestado medio/mes</div></div>
      <div class="kpi"><div class="big">${euro0(santanderTotal)}</div><div class="lbl">Enviado a Santander (año)</div></div>
      <div class="kpi"><div class="big">${mesesColchon.toLocaleString("es-ES",{maximumFractionDigits:1})} meses</div><div class="lbl">Colchón CAJA 7 cubre</div></div>
    </div>

    <div class="section-title">Enviado a Santander mes a mes</div>
    <div class="card">
      ${renderEvolutionChart(filled)}
    </div>

    <div class="section-title">¿Dónde se va tu dinero?</div>
    <div class="card">
      ${renderCategoryBreakdown(filled)}
    </div>

    <div class="section-title">Previsión</div>
    <div class="card">
      ${renderForecast(saldoSantanderActual)}
    </div>

    <div class="section-title">Saldos acumulados</div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Mes</th><th>+Santander</th><th>Saldo San.</th><th>+Trade Rep.</th><th>Saldo TR</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
    <p style="font-size:11px; color:var(--light-gray); margin:0 0 10px;">Los saldos arrastran lo acumulado en años anteriores y no incluyen rentabilidad de las inversiones.</p>

    <div class="section-title">Meses con sobregasto</div>
    <div class="card">
      ${renderOverspendList(filled)}
    </div>

    <div class="section-title">Objetivos en Santander</div>
    <div class="card">
      ${renderGoalsSection(saldoSantanderActual)}
    </div>

    <button class="btn no-print" id="btn-print">🖨️ Imprimir / guardar resumen de ${activeYear} en PDF</button>
    <p class="no-print" style="font-size:11px; color:var(--light-gray); margin:6px 0 0; text-align:center;">En el diálogo de impresión elige "Guardar como PDF".</p>
  `;
}

function renderEvolutionChart(filled) {
  const vals = filled.map(r => r ? r.totalSantander : null);
  if (!vals.some(v => v !== null)) {
    return `<p style="font-size:13px; color:var(--gray); margin:0;">Aún no hay meses con datos en ${activeYear}.</p>`;
  }
  const nums = vals.filter(v => v !== null);
  const maxV = Math.max(0, ...nums);
  const minV = Math.min(0, ...nums);
  const range = (maxV - minV) || 1;
  const W = 320, top = 18, bottom = 128, H = bottom - top;
  const slot = W / 12, barW = slot * 0.62;
  const zeroY = top + (maxV / range) * H;
  let bars = "";
  vals.forEach((v, i) => {
    const x = i * slot + (slot - barW) / 2;
    const cx = i * slot + slot / 2;
    if (v !== null) {
      const h = Math.max(1.5, (Math.abs(v) / range) * H);
      const y = v >= 0 ? zeroY - h : zeroY;
      const color = v >= 0 ? "var(--teal)" : "var(--red)";
      const labelY = v >= 0 ? y - 3 : y + h + 9;
      bars += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${barW.toFixed(1)}" height="${h.toFixed(1)}" rx="2" style="fill:${color}"/>`;
      bars += `<text x="${cx.toFixed(1)}" y="${labelY.toFixed(1)}" text-anchor="middle" style="font-size:8px; fill:var(--gray); font-weight:700;">${Math.round(v)}</text>`;
    }
    bars += `<text x="${cx.toFixed(1)}" y="146" text-anchor="middle" style="font-size:8px; fill:var(--light-gray);">${MONTHS[i].slice(0,3)}</text>`;
  });
  return `
    <svg viewBox="0 0 ${W} 152" width="100%" role="img" aria-label="Enviado a Santander cada mes de ${activeYear}">
      <line x1="0" y1="${zeroY.toFixed(1)}" x2="${W}" y2="${zeroY.toFixed(1)}" style="stroke:var(--border); stroke-width:1;"/>
      ${bars}
    </svg>
  `;
}

function projectedMonth(year, idx) {
  const base = { mes: MONTHS[idx], _anio: year };
  return calcMonth({ ...base, salario: pv("salarioBase", base), gastosExcepcionales: [] });
}
function addMonths(year, idx, n) { const t = year * 12 + idx + n; return [Math.floor(t / 12), t % 12]; }
// Para cada objetivo: 0 = ya alcanzado, clave AAAAMM = mes previsto, null = no llega en 10 años.
function computeGoalETAs(saldoSanNow) {
  const hoy = new Date(), y0 = hoy.getFullYear(), m0 = hoy.getMonth();
  const isFilled = (y, i) => { const arr = monthsDataByYear[String(y)]; return arr && calcMonth(arr[i]); };
  const targets = []; let acc = 0; goals.forEach(g => { acc += g.meta; targets.push(acc); });
  const eta = goals.map((g, i) => saldoSanNow >= targets[i] ? 0 : null);
  let san = saldoSanNow;
  for (let k = 0; k < 120 && eta.some(e => e === null); k++) {
    const [y, i] = addMonths(y0, m0, k);
    if (!isFilled(y, i)) san += projectedMonth(y, i).totalSantander;
    goals.forEach((g, gi) => { if (eta[gi] === null && san >= targets[gi]) eta[gi] = periodKey(y, i); });
  }
  return eta;
}
function etaTexto(e) { return e === 0 ? "✅ ya alcanzado" : e ? periodoTexto(e) : "no llegas con este ritmo"; }

function renderForecast(saldoSanNow) {
  const hoy = new Date(), y0 = hoy.getFullYear(), m0 = hoy.getMonth();
  const saldoTRNow = params.saldoTradeRepublic + sumAllYears(r => r.totalTradeRepublic);
  const isFilled = (y, i) => { const arr = monthsDataByYear[String(y)]; return arr && calcMonth(arr[i]); };
  let san = saldoSanNow, tr = saldoTRNow, decSan = null, decTR = null;
  for (let k = 0; k < 120; k++) {
    const [y, i] = addMonths(y0, m0, k);
    if (y > activeYear) break;
    if (!isFilled(y, i)) { const r = projectedMonth(y, i); san += r.totalSantander; tr += r.totalTradeRepublic; }
    if (y === activeYear && i === 11) { decSan = san; decTR = tr; }
  }
  const eta = computeGoalETAs(saldoSanNow);
  const lineas = [];
  if (decSan !== null) {
    lineas.push(`<div class="result-row"><span class="label">Santander a diciembre ${activeYear}</span><span class="value">${euro0(decSan)}</span></div>`);
    lineas.push(`<div class="result-row"><span class="label">Trade Republic a diciembre ${activeYear}</span><span class="value">${euro0(decTR)}</span></div>`);
  }
  goals.forEach((g, gi) => {
    lineas.push(`<div class="result-row"><span class="label">${escapeHtml(g.nombre)}</span><span class="value">${etaTexto(eta[gi])}</span></div>`);
  });
  if (!lineas.length) return `<p style="font-size:13px; color:var(--gray); margin:0;">Nada que prever para ${activeYear}.</p>`;
  return lineas.join("") + `<p style="font-size:11px; color:var(--light-gray); margin:8px 0 0;">Supone que los meses sin rellenar cobras tu salario base, sin ajustes, ingresos extra ni gastos excepcionales. Los objetivos se reparten por orden de creación.</p>`;
}

function renderCategoryBreakdown(filled) {
  const sum = fn => filled.reduce((a, r) => r ? a + fn(r) : a, 0);
  const cats = [
    { n: "Fijos esenciales (alquiler, compra, gasolina)", v: sum(r => r.fijosEsencialesReal), c: "var(--navy)" },
    { n: "Suscripciones y peluquería", v: sum(r => r.subsPelu), c: "var(--teal)" },
    { n: "Coche (seguro, ITV)", v: sum(r => r.ocasional - r.extrasTotal), c: "var(--gold)" },
    { n: "Tus gastos personalizados", v: sum(r => r.extrasTotal), c: "var(--ice)" },
    { n: "Ocio", v: sum(r => Math.max(0, r.ocioRealGastado)), c: "var(--light-gray)" },
    { n: "Gastos excepcionales", v: sum(r => r.gastoExcepcional), c: "var(--red)" },
    { n: "Inversión (Trade Republic)", v: sum(r => r.inversion), c: "var(--teal)" },
  ].filter(c => c.v > 0.005);
  const total = cats.reduce((a, c) => a + c.v, 0);
  if (!total) return `<p style="font-size:13px; color:var(--gray); margin:0;">Aún no hay meses con datos en ${activeYear}.</p>`;
  const max = Math.max(...cats.map(c => c.v));
  return cats.sort((a, b) => b.v - a.v).map(c => `
    <div class="cat-row">
      <div class="cat-head"><span>${c.n}</span><span class="cat-val">${euro0(c.v)} · ${(c.v / total * 100).toFixed(0)}%</span></div>
      <div class="cat-bar-bg"><div class="cat-bar-fill" style="width:${(c.v / max * 100).toFixed(1)}%; background:${c.c};"></div></div>
    </div>`).join("") + `<p style="font-size:11px; color:var(--light-gray); margin:6px 0 0;">Porcentaje sobre lo que sale por ING y Trade Republic en los meses rellenados de ${activeYear}.</p>`;
}

function renderOverspendList(filled) {
  const items = [];
  MONTHS.forEach((m, i) => {
    const r = filled[i];
    if (!r) return;
    const ocioOver = r.ajuste > 0 ? r.ajuste : 0;
    const gasOver = r.ajusteGasolina > 0 ? r.ajusteGasolina : 0;
    const compraOver = r.ajusteCompra > 0 ? r.ajusteCompra : 0;
    const excepcional = r.gastoExcepcional > 0 ? r.gastoExcepcional : 0;
    if (ocioOver > 0 || gasOver > 0 || compraOver > 0 || excepcional > 0) items.push({ mes: m, ocioOver, gasOver, compraOver, excepcional, excepcionalNota: r.gastoExcepcionalNota });
  });
  if (items.length === 0) {
    return `<p style="font-size:13px; color:var(--teal); margin:0; font-weight:600;">✅ Ningún mes con sobregasto todavía.</p>`;
  }
  return items.map(o => {
    const parts = [];
    if (o.ocioOver) parts.push(`Ocio +${euro(o.ocioOver)}`);
    if (o.gasOver) parts.push(`Gasolina +${euro(o.gasOver)}`);
    if (o.compraOver) parts.push(`Compra +${euro(o.compraOver)}`);
    if (o.excepcional) parts.push(`Excepcional +${euro(o.excepcional)}${o.excepcionalNota ? ` (${escapeHtml(o.excepcionalNota)})` : ""}`);
    const impacto = -(o.ocioOver + o.gasOver + o.compraOver + o.excepcional);
    return `<div class="result-row"><span class="label">${o.mes}<span style="display:block; font-size:11px; color:var(--light-gray); font-weight:400; margin-top:2px;">${parts.join(" · ")}</span></span><span class="value" style="color:var(--red)">${euro(impacto)}</span></div>`;
  }).join("");
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function goalPaceHtml(g, asignado, eta, hoyD) {
  if (!g.fecha) return "";
  const [fy, fm] = g.fecha.split("-").map(Number);
  const dKey = fy * 100 + fm;
  const falta = Math.max(0, g.meta - asignado);
  if (falta <= 0) return `<div class="goal-pace ok">✅ Objetivo conseguido</div>`;
  const meses = (fy * 12 + (fm - 1)) - (hoyD.getFullYear() * 12 + hoyD.getMonth()) + 1;
  if (meses <= 0) return `<div class="goal-pace bad">⚠️ La fecha ya pasó y te faltan ${euro0(falta)}</div>`;
  const mensual = Math.ceil(falta / meses);
  const enTiempo = eta !== null && eta <= dKey;
  return `<div class="goal-pace ${enTiempo ? "ok" : "bad"}">Para llegar a ${periodoTexto(dKey)} tendrías que apartar <strong>${euro0(mensual)}/mes</strong> (${meses} ${meses === 1 ? "mes" : "meses"}).<br>${enTiempo ? "✅ Vas bien" : "⚠️ Vas tarde"} · previsto: ${etaTexto(eta)}</div>`;
}

function renderGoalsSection(saldoActual) {
  let remaining = saldoActual;
  const etas = computeGoalETAs(saldoActual);
  const hoyD = new Date();
  const cards = goals.map((g, gi) => {
    const asignado = Math.max(0, Math.min(g.meta, remaining));
    remaining -= asignado;
    const pctVal = g.meta > 0 ? Math.min(100, (asignado / g.meta) * 100) : 0;
    const done = g.meta > 0 && asignado >= g.meta;
    return `
      <div class="goal-card">
        <div class="goal-head">
          <span class="goal-name">${escapeHtml(g.nombre)}${done ? " ✅" : ""}</span>
          <button class="goal-delete" data-goal="${g.id}" aria-label="Eliminar objetivo">✕</button>
        </div>
        <div class="goal-bar-bg"><div class="goal-bar-fill" style="width:${pctVal}%"></div></div>
        <div class="goal-sub">${euro0(asignado)} de ${euro0(g.meta)} · ${pctVal.toFixed(0)}%</div>
        <div class="goal-date-row">
          <label>Fecha meta <input type="month" data-goal-date="${g.id}" value="${g.fecha || ""}"></label>
        </div>
        ${goalPaceHtml(g, asignado, etas[gi], hoyD)}
      </div>
    `;
  }).join("");

  const formOrButton = showAddGoalForm ? `
    <div class="goal-form">
      <input type="text" id="new-goal-name" placeholder="Nombre del objetivo (ej. PS5)">
      <input type="number" step="0.01" id="new-goal-amount" placeholder="Importe objetivo (€)">
      <label style="display:block; font-size:12px; color:var(--gray); margin:2px 0 8px; font-weight:600;">Fecha meta (opcional) <input type="month" id="new-goal-date" style="margin-top:4px;"></label>
      <div class="two-col" style="margin-top:8px;">
        <button class="btn small" id="btn-save-goal">Guardar</button>
        <button class="btn small secondary" id="btn-cancel-goal">Cancelar</button>
      </div>
    </div>
  ` : `<button class="btn" id="btn-add-goal">+ Nuevo objetivo</button>`;

  return `
    <p style="font-size:11.5px; color:var(--light-gray); margin:0 0 12px;">Saldo actual en Santander: <strong style="color:var(--fg)">${euro0(saldoActual)}</strong>. Se reparte entre tus objetivos por orden de creación.</p>
    ${goals.length ? cards : `<p style="font-size:13px; color:var(--gray); margin:0 0 10px;">Aún no tienes objetivos de ahorro.</p>`}
    ${formOrButton}
  `;
}

const NOMBRES_CAMPOS = { salarioBase:"Salario base", alquiler:"Alquiler", compra:"Compra", gasolina:"Gasolina", suscripciones:"Suscripciones", peluqueria:"Peluquería", inversion:"Inversión", ahorroFijo:"Ahorro fijo", seguroCoche:"Seguro del coche", rodaje:"Rodaje / ITV" };
function periodoTexto(key) { return MONTHS[(key % 100) - 1] + " " + Math.floor(key / 100); }
function renderHistorialCambios() {
  const filas = [];
  Object.entries(params.historial || {}).forEach(([campo, h]) => {
    h.forEach((e, i) => {
      if (i === 0) return;
      filas.push({ campo, desde: e.desde, antes: h[i - 1].valor, ahora: e.valor });
    });
  });
  if (!filas.length) return `<p style="font-size:13px; color:var(--gray); margin:0;">Aún no has cambiado ningún importe con fecha. Cuando edites uno arriba, aparecerá aquí.</p>`;
  filas.sort((a, b) => b.desde - a.desde);
  return filas.map(f => `
    <div class="result-row">
      <span class="label">${NOMBRES_CAMPOS[f.campo] || f.campo}<span style="display:block; font-size:11px; color:var(--light-gray); font-weight:400; margin-top:2px;">${euro(f.antes)} → ${euro(f.ahora)} · desde ${periodoTexto(f.desde)}</span></span>
      <span class="value"><button class="goal-delete" data-hist-campo="${f.campo}" data-hist-desde="${f.desde}" aria-label="Deshacer cambio">↩</button></span>
    </div>`).join("") + `<p style="font-size:11px; color:var(--light-gray); margin:8px 0 0;">↩ deshace ese cambio: los meses afectados vuelven al importe anterior.</p>`;
}
let efectoDesde = { mes: new Date().getMonth(), anio: new Date().getFullYear() };
function renderAjustes() {
  const p = params;
  const monthOptions = (selected) => MONTHS.map(m => `<option value="${m}" ${m===selected?"selected":""}>${m}</option>`).join("");
  const seguroMes1 = p.mesesSeguro[0] || "Abril";
  const seguroMes2 = p.mesesSeguro[1] || "Mayo";
  const storageMode = (FIREBASE_CONFIGURED && currentUser)
    ? `<div class="ok-banner">☁️ Sesión iniciada como <strong>${escapeHtml(currentUser.email)}</strong> — tus datos se guardan en la nube y se ven igual en cualquier dispositivo. <button class="btn small secondary" id="btn-logout" style="width:auto; margin-top:8px;">Cerrar sesión</button></div>`
    : hasClaudeStorage()
    ? `<div class="ok-banner">☁️ Guardando en tu cuenta de Claude — debería verse igual en tus demás dispositivos dentro de la app.</div>`
    : `<div class="warn-banner" style="background:#FFF6D9; color:#8A6D1D; border-color:#F0DFA0;">💾 Guardando solo en este navegador — no se comparte con otros dispositivos. Inicia sesión para tener tus datos en cualquier dispositivo.</div>`;

  return `
    <div class="card" style="margin-bottom:14px;">${storageMode}</div>
    <div class="section-title">Salario y saldos</div>
    <div class="card">
      <div class="field"><label>Salario base de referencia</label><input type="number" step="0.01" id="p-salarioBase" value="${p.salarioBase}"></div>
      <div class="two-col">
        <div class="field"><label>Saldo inicial Santander</label><input type="number" step="0.01" id="p-saldoSantander" value="${p.saldoSantander}"></div>
        <div class="field"><label>Saldo inicial Trade Republic</label><input type="number" step="0.01" id="p-saldoTradeRepublic" value="${p.saldoTradeRepublic}"></div>
      </div>
      <div class="field"><label>Colchón objetivo CAJA 7</label><input type="number" step="0.01" id="p-colchon" value="${p.colchon}"></div>
    </div>

    <div class="section-title">Gastos fijos mensuales</div>
    <div class="card">
      <p style="font-size:12.5px; color:var(--gray); margin:0 0 10px;">Cuando cambies un importe de abajo (suscripciones, alquiler, inversión…), el cambio vale <strong>desde este mes</strong> en adelante. Los meses anteriores mantienen el importe que tenían.</p>
      <div class="two-col">
        <div class="field"><label>Aplicar cambios desde</label><select id="efecto-mes">${MONTHS.map((m,i)=>`<option value="${i}" ${i===efectoDesde.mes?"selected":""}>${m}</option>`).join("")}</select></div>
        <div class="field"><label>Año</label><select id="efecto-anio">${[activeYear-1,activeYear,activeYear+1].map(y=>`<option value="${y}" ${y===efectoDesde.anio?"selected":""}>${y}</option>`).join("")}</select></div>
      </div>
    </div>
    <div class="card">
      <div class="two-col">
        <div class="field"><label>Alquiler</label><input type="number" step="0.01" id="p-alquiler" value="${p.alquiler}"></div>
        <div class="field"><label>Compra <span class="hint">Presupuesto medio; ajústalo cada mes en la pestaña Mensual</span></label><input type="number" step="0.01" id="p-compra" value="${p.compra}"></div>
      </div>
      <div class="two-col">
        <div class="field"><label>Gasolina <span class="hint">Presupuesto medio; ajústalo cada mes en la pestaña Mensual</span></label><input type="number" step="0.01" id="p-gasolina" value="${p.gasolina}"></div>
        <div class="field"><label>Suscripciones</label><input type="number" step="0.01" id="p-suscripciones" value="${p.suscripciones}"></div>
      </div>
      <div class="two-col">
        <div class="field"><label>Peluquería</label><input type="number" step="0.01" id="p-peluqueria" value="${p.peluqueria}"></div>
        <div class="field"><label>Inversión automática</label><input type="number" step="0.01" id="p-inversion" value="${p.inversion}"></div>
      </div>
      <div class="field"><label>Ahorro fijo (Santander)</label><input type="number" step="0.01" id="p-ahorroFijo" value="${p.ahorroFijo}"></div>
    </div>

    <div class="section-title">Gastos ocasionales del coche</div>
    <div class="card">
      <div class="two-col">
        <div class="field"><label>Seguro del coche (importe)</label><input type="number" step="0.01" id="p-seguroCoche" value="${p.seguroCoche}"></div>
        <div class="field"><label>Rodaje / ITV (importe)</label><input type="number" step="0.01" id="p-rodaje" value="${p.rodaje}"></div>
      </div>
      <div class="two-col">
        <div class="field"><label>Mes 1 del seguro</label><select id="p-mesSeguro1">${monthOptions(seguroMes1)}</select></div>
        <div class="field"><label>Mes 2 del seguro</label><select id="p-mesSeguro2">${monthOptions(seguroMes2)}</select></div>
      </div>
      <div class="field"><label>Mes del rodaje / ITV</label><select id="p-mesRodaje">${monthOptions(p.mesRodaje)}</select></div>
    </div>

    <div class="section-title">Tus gastos personalizados</div>
    <div class="card">
      <p style="font-size:12.5px; color:var(--gray); margin:0 0 10px;">Añade cualquier gasto que no encaje arriba (gimnasio, colegio, una cuota anual...). Elige en qué meses se aplica: si no marcas ninguno, se suma todos los meses.</p>
      ${(p.extras || []).length ? (p.extras || []).map(ex => `
        <div class="result-row">
          <span class="label">${escapeHtml(ex.nombre)}<span style="display:block; font-size:11px; color:var(--light-gray); font-weight:400; margin-top:2px;">${extraMesesTexto(ex)}</span></span>
          <span class="value" style="display:flex; align-items:center; gap:8px;">
            ${euro(Number(ex.importe) || 0)}
            <button class="goal-delete" data-extra="${ex.id}" aria-label="Eliminar gasto">✕</button>
          </span>
        </div>
      `).join("") : `<p style="font-size:13px; color:var(--gray); margin:0 0 10px;">Aún no has añadido ninguno.</p>`}
      <div class="two-col" style="margin-top:10px;">
        <div class="field"><label>Nombre</label><input type="text" id="new-extra-name" placeholder="Ej. Gimnasio"></div>
        <div class="field"><label>Importe (por mes aplicado)</label><input type="number" step="0.01" id="new-extra-amount" placeholder="Ej. 35"></div>
      </div>
      <div class="field"><label>Meses en los que se aplica <span class="hint">Sin marcar = todos los meses</span></label>
        <div class="chip-row" id="new-extra-months">
          ${MONTHS.map(m => `<button type="button" class="chip" data-mes="${m}">${m.slice(0,3)}</button>`).join("")}
        </div>
      </div>
      <button class="btn" id="btn-add-extra">+ Añadir gasto</button>
    </div>

    <div class="section-title">Historial de cambios de importes</div>
    <div class="card" id="hist-card">${renderHistorialCambios()}</div>

    <div class="section-title">Color de la app</div>
    <div class="card">
      <div class="result-row" style="margin-bottom:4px; padding-bottom:12px; border-bottom:1px dashed var(--border);">
        <span class="label">🌙 Modo oscuro</span>
        <button id="toggle-dark" class="dark-switch ${p.modoOscuro ? "on" : ""}" role="switch" aria-checked="${p.modoOscuro ? "true" : "false"}" aria-label="Modo oscuro">
          <span class="dark-switch-knob"></span>
        </button>
      </div>
      <p style="font-size:12.5px; color:var(--gray); margin:12px 0 10px;">Elige el tema de color. Es solo tuyo — cada persona que use la app puede elegir el suyo.</p>
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        ${Object.entries(THEMES).map(([id, t]) => `
          <button data-tema="${id}" style="
            width:52px; height:52px; border-radius:50%; border:3px solid ${p.tema===id?"var(--fg)":"transparent"};
            background:${t.navy}; display:flex; align-items:center; justify-content:center; padding:0;">
            ${p.tema===id ? '<span style="color:#fff; font-size:16px;">✓</span>' : ""}
          </button>
        `).join("")}
      </div>
    </div>

    <div class="section-title">Copia de seguridad</div>
    <div class="card">
      <p style="font-size:12.5px; color:var(--gray); margin:0 0 12px;">Descarga un Excel con todos tus datos tal y como están ahora mismo (meses, parámetros y objetivos). No hay backup automático real: los navegadores no permiten guardar en tus archivos sin que tú lo pidas, así que descárgalo cuando quieras tener una copia al día.</p>
      <button class="btn" id="btn-export">⬇️ Descargar copia de seguridad (Excel)</button>
    </div>

    <button class="btn secondary" id="btn-reset">Borrar todos mis datos</button>
  `;
}

// ---------- Handlers ----------
function attachHandlers() {
  document.querySelectorAll(".month-pill").forEach(btn => {
    btn.onclick = () => { activeMonthIdx = Number(btn.dataset.month); render(); };
  });

  const copyPrevBtn = document.getElementById("btn-copy-prev");
  if (copyPrevBtn) copyPrevBtn.onclick = () => {
    const { mData: prev } = getPreviousMonthInfo(activeYear, activeMonthIdx);
    if (!prev) return;
    const cur = monthsData[activeMonthIdx];
    // Solo copia los ajustes recurrentes; el salario, ingresos extra y gastos excepcionales no se copian.
    cur.ajusteOcio = prev.ajusteOcio ?? null;
    cur.ajusteGasolina = prev.ajusteGasolina ?? null;
    cur.ajusteCompra = prev.ajusteCompra ?? null;
    saveMonths();
    render();
  };

  const yearPrev = document.getElementById("year-prev");
  if (yearPrev) yearPrev.onclick = () => {
    const nowYear = new Date().getFullYear();
    if (activeYear <= nowYear) return; // no se puede ir a años anteriores al actual
    changeYear(activeYear - 1);
  };
  const yearNext = document.getElementById("year-next");
  if (yearNext) yearNext.onclick = () => {
    const nowYear = new Date().getFullYear();
    if (activeYear >= nowYear + 5) return;
    changeYear(activeYear + 1);
  };

  const salarioInput = document.getElementById("input-salario");
  if (salarioInput) {
    salarioInput.oninput = () => {
      const v = salarioInput.value;
      monthsData[activeMonthIdx].salario = v === "" ? null : Number(v);
      document.getElementById("results-container").innerHTML = computeResultsHtml(monthsData[activeMonthIdx]);
      attachResultHandlers();
    };
    salarioInput.onchange = () => { saveMonths(); updatePillState(); };
  }
  const ajusteInput = document.getElementById("input-ajuste");
  if (ajusteInput) {
    ajusteInput.oninput = () => {
      const v = ajusteInput.value;
      monthsData[activeMonthIdx].ajusteOcio = v === "" ? null : Number(v);
      document.getElementById("results-container").innerHTML = computeResultsHtml(monthsData[activeMonthIdx]);
      attachResultHandlers();
    };
    ajusteInput.onchange = saveMonths;
  }
  const ajusteGasolinaInput = document.getElementById("input-ajuste-gasolina");
  if (ajusteGasolinaInput) {
    ajusteGasolinaInput.oninput = () => {
      const v = ajusteGasolinaInput.value;
      monthsData[activeMonthIdx].ajusteGasolina = v === "" ? null : Number(v);
      document.getElementById("results-container").innerHTML = computeResultsHtml(monthsData[activeMonthIdx]);
      attachResultHandlers();
    };
    ajusteGasolinaInput.onchange = saveMonths;
  }
  const ajusteCompraInput = document.getElementById("input-ajuste-compra");
  if (ajusteCompraInput) {
    ajusteCompraInput.oninput = () => {
      const v = ajusteCompraInput.value;
      monthsData[activeMonthIdx].ajusteCompra = v === "" ? null : Number(v);
      document.getElementById("results-container").innerHTML = computeResultsHtml(monthsData[activeMonthIdx]);
      attachResultHandlers();
    };
    ajusteCompraInput.onchange = saveMonths;
  }
  const ingresosExtraInput = document.getElementById("input-ingresos-extra");
  if (ingresosExtraInput) {
    ingresosExtraInput.oninput = () => {
      const v = ingresosExtraInput.value;
      monthsData[activeMonthIdx].ingresosExtra = v === "" ? null : Number(v);
      document.getElementById("results-container").innerHTML = computeResultsHtml(monthsData[activeMonthIdx]);
      attachResultHandlers();
    };
    ingresosExtraInput.onchange = saveMonths;
  }
  const notaEl = document.getElementById("input-nota");
  if (notaEl) {
    notaEl.oninput = () => { monthsData[activeMonthIdx].nota = notaEl.value; };
    notaEl.onchange = saveMonths;
  }
  const closeBtn = document.getElementById("btn-close-month");
  if (closeBtn) closeBtn.onclick = () => { monthsData[activeMonthIdx].cerrado = true; saveMonths(); render(); };
  const reopenBtn = document.getElementById("btn-reopen");
  if (reopenBtn) reopenBtn.onclick = () => { monthsData[activeMonthIdx].cerrado = false; saveMonths(); render(); };
  if (activeTab === "mensual" && monthsData[activeMonthIdx].cerrado) {
    document.querySelectorAll("#input-salario,#input-ajuste,#input-ajuste-gasolina,#input-ajuste-compra,#input-ingresos-extra,#exc-concepto,#exc-importe,#btn-add-exc,[data-exc-del],#btn-copy-prev")
      .forEach(el => { el.disabled = true; });
  }
  const addExcBtn = document.getElementById("btn-add-exc");
  if (addExcBtn) addExcBtn.onclick = () => {
    const concepto = document.getElementById("exc-concepto").value.trim();
    const importe = Number(document.getElementById("exc-importe").value);
    if (!importe || importe <= 0) { alert("Escribe un importe válido."); return; }
    const m = monthsData[activeMonthIdx];
    m.gastosExcepcionales = [...excepcionalesDe(m).map(g => ({ ...g, id: g.id || Date.now() + Math.random() })), { id: Date.now(), concepto, importe }];
    m.gastoExcepcional = null; m.gastoExcepcionalNota = null;
    saveMonths(); render();
  };
  document.querySelectorAll("[data-exc-del]").forEach(btn => {
    btn.onclick = () => {
      const m = monthsData[activeMonthIdx];
      const id = btn.dataset.excDel;
      m.gastosExcepcionales = excepcionalesDe(m).filter(g => String(g.id) !== id);
      m.gastoExcepcional = null; m.gastoExcepcionalNota = null;
      saveMonths(); render();
    };
  });
  attachResultHandlers();

  const printBtn = document.getElementById("btn-print");
  if (printBtn) printBtn.onclick = () => { try { window.print(); } catch (e) { alert("No se pudo abrir la impresión en este dispositivo."); } };
  document.querySelectorAll("[data-goal-date]").forEach(inp => {
    inp.onchange = () => {
      const g = goals.find(x => String(x.id) === inp.dataset.goalDate);
      if (g) { g.fecha = inp.value; saveGoals(); render(); }
    };
  });
  const addGoalBtn = document.getElementById("btn-add-goal");
  if (addGoalBtn) addGoalBtn.onclick = () => { showAddGoalForm = true; render(); };
  const cancelGoalBtn = document.getElementById("btn-cancel-goal");
  if (cancelGoalBtn) cancelGoalBtn.onclick = () => { showAddGoalForm = false; render(); };
  const saveGoalBtn = document.getElementById("btn-save-goal");
  if (saveGoalBtn) saveGoalBtn.onclick = () => {
    const nameEl = document.getElementById("new-goal-name");
    const amtEl = document.getElementById("new-goal-amount");
    const nombre = nameEl.value.trim();
    const meta = Number(amtEl.value);
    if (!nombre || !meta || meta <= 0) { alert("Escribe un nombre y un importe objetivo válido."); return; }
    goals.push({ id: Date.now(), nombre, meta, fecha: (document.getElementById("new-goal-date") || {}).value || "" });
    showAddGoalForm = false;
    saveGoals();
    render();
  };
  document.querySelectorAll(".goal-delete[data-goal]").forEach(btn => {
    btn.onclick = () => {
      const id = Number(btn.dataset.goal);
      goals = goals.filter(g => g.id !== id);
      saveGoals();
      render();
    };
  });

  const addExtraBtn = document.getElementById("btn-add-extra");
  if (addExtraBtn) addExtraBtn.onclick = () => {
    const nameEl = document.getElementById("new-extra-name");
    const amtEl = document.getElementById("new-extra-amount");
    const nombre = nameEl.value.trim();
    const importe = Number(amtEl.value);
    if (!nombre || !importe || importe <= 0) { alert("Escribe un nombre y un importe válido."); return; }
    const meses = [...document.querySelectorAll("#new-extra-months .chip.on")].map(c => c.dataset.mes);
    params.extras = [...(params.extras || []), { id: Date.now(), nombre, importe, meses: meses.length === 12 ? [] : meses }];
    saveParams();
    render();
  };
  document.querySelectorAll("#new-extra-months .chip").forEach(chip => {
    chip.onclick = () => chip.classList.toggle("on");
  });
  document.querySelectorAll(".goal-delete[data-extra]").forEach(btn => {
    btn.onclick = () => {
      const id = Number(btn.dataset.extra);
      params.extras = (params.extras || []).filter(ex => ex.id !== id);
      saveParams();
      render();
    };
  });

  document.querySelectorAll("[data-tema]").forEach(btn => {
    btn.onclick = () => {
      params.tema = btn.dataset.tema;
      applyTheme(params.tema);
      saveParams();
      render();
    };
  });

  const darkToggle = document.getElementById("toggle-dark");
  if (darkToggle) {
    darkToggle.onclick = () => {
      params.modoOscuro = !params.modoOscuro;
      applyDarkMode(params.modoOscuro);
      applyTheme(params.tema);
      saveParams();
      render();
    };
  }

  const paramFieldMap = {
    "p-salarioBase":"salarioBase","p-saldoSantander":"saldoSantander","p-saldoTradeRepublic":"saldoTradeRepublic",
    "p-colchon":"colchon","p-alquiler":"alquiler","p-compra":"compra","p-gasolina":"gasolina",
    "p-suscripciones":"suscripciones","p-peluqueria":"peluqueria","p-inversion":"inversion",
    "p-ahorroFijo":"ahorroFijo","p-seguroCoche":"seguroCoche","p-rodaje":"rodaje",
  };
  Object.entries(paramFieldMap).forEach(([id, key]) => {
    const el = document.getElementById(id);
    if (el) el.onchange = () => {
      const nuevo = Number(el.value) || 0;
      if (CAMPOS_HISTORIAL.includes(key)) {
        const desde = periodKey(efectoDesde.anio, efectoDesde.mes);
        const h = (params.historial && params.historial[key] && params.historial[key].length)
          ? params.historial[key].filter(e => e.desde !== desde)
          : [{ desde: 0, valor: params[key] }];
        if (!h.length) h.push({ desde: 0, valor: params[key] });
        h.push({ desde, valor: nuevo });
        h.sort((a, b) => a.desde - b.desde);
        params.historial = { ...(params.historial || {}), [key]: h };
        params[key] = h[h.length - 1].valor;
      } else {
        params[key] = nuevo;
      }
      saveParams();
      const hc = document.getElementById("hist-card");
      if (hc) { hc.innerHTML = renderHistorialCambios(); bindHistorial(); }
    };
  });
  function bindHistorial() { document.querySelectorAll("[data-hist-campo]").forEach(btn => {
    btn.onclick = () => {
      const campo = btn.dataset.histCampo, desde = Number(btn.dataset.histDesde);
      let h = (params.historial[campo] || []).filter(e => e.desde !== desde);
      const hist = { ...params.historial };
      if (h.length <= 1) { delete hist[campo]; params[campo] = h.length ? h[0].valor : params[campo]; }
      else { hist[campo] = h; params[campo] = h[h.length - 1].valor; }
      params.historial = hist;
      saveParams(); render();
    };
  }); }
  bindHistorial();
  const efMes = document.getElementById("efecto-mes"), efAnio = document.getElementById("efecto-anio");
  if (efMes) efMes.onchange = () => { efectoDesde.mes = Number(efMes.value); };
  if (efAnio) efAnio.onchange = () => { efectoDesde.anio = Number(efAnio.value); };

  const ms1 = document.getElementById("p-mesSeguro1");
  const ms2 = document.getElementById("p-mesSeguro2");
  const mr = document.getElementById("p-mesRodaje");
  if (ms1) ms1.onchange = () => { params.mesesSeguro = [ms1.value, ms2.value]; saveParams(); };
  if (ms2) ms2.onchange = () => { params.mesesSeguro = [ms1.value, ms2.value]; saveParams(); };
  if (mr) mr.onchange = () => { params.mesRodaje = mr.value; saveParams(); };

  const exportBtn = document.getElementById("btn-export");
  if (exportBtn) exportBtn.onclick = exportBackup;

  const logoutBtn = document.getElementById("btn-logout");
  if (logoutBtn) logoutBtn.onclick = () => { if (auth) auth.signOut(); };

  const resetBtn = document.getElementById("btn-reset");
  if (resetBtn) resetBtn.onclick = async () => {
    if (!confirm("¿Seguro que quieres borrar todos tus datos guardados, de todos los años? Esta acción no se puede deshacer.")) return;
    params = { ...DEFAULT_PARAMS };
    monthsDataByYear = {};
    activeYear = new Date().getFullYear();
    monthsData = getMonthsForYear(activeYear);
    goals = [];
    await saveParams();
    await saveMonths();
    await saveGoals();
    render();
  };
}

function attachResultHandlers() {
  const toggle = document.getElementById("toggle-fijos");
  if (toggle) {
    toggle.onclick = () => {
      expandedFijos = !expandedFijos;
      document.getElementById("results-container").innerHTML = computeResultsHtml(monthsData[activeMonthIdx]);
      attachResultHandlers();
    };
  }
  const toggleExtras = document.getElementById("toggle-extras");
  if (toggleExtras) {
    toggleExtras.onclick = () => {
      expandedExtras = !expandedExtras;
      document.getElementById("results-container").innerHTML = computeResultsHtml(monthsData[activeMonthIdx]);
      attachResultHandlers();
    };
  }
}

function updatePillState() {
  document.querySelectorAll(".month-pill").forEach((btn, i) => {
    if (i === activeMonthIdx) return;
    const filled = monthsData[i].salario !== null && monthsData[i].salario !== undefined && monthsData[i].salario !== "";
    btn.classList.toggle("filled", filled);
  });
}

// ---------- Tabs ----------
document.querySelectorAll("nav.tabbar button").forEach(btn => {
  btn.addEventListener("click", () => { activeTab = btn.dataset.tab; render(); });
});

// ---------- Init ----------
function irAHoy() {
  const hoy = new Date();
  activeYear = hoy.getFullYear();
  monthsData = getMonthsForYear(activeYear);
  activeMonthIdx = hoy.getMonth();
}
// Si dejas la app abierta y cambia el mes, al volver se abre en el mes de hoy.
let _ultimoDia = new Date().toDateString();
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && ready && _ultimoDia !== new Date().toDateString()) {
    _ultimoDia = new Date().toDateString();
    irAHoy(); render();
  }
});
(async function init() {
  if (FIREBASE_CONFIGURED) {
    setupAuthHandlers();
    showAuthScreen();
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        currentUser = user;
        showApp();
        await loadData();
        irAHoy();
        ready = true;
        render();
      } else {
        currentUser = null;
        ready = false;
        showAuthScreen();
      }
    });
  } else {
    await loadData();
    irAHoy();
    ready = true;
    render();
  }
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((e) => console.error("SW error:", e));
  });
}
</script>
</body>
</html>
